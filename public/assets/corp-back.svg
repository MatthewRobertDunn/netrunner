<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 308" width="220" height="308">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30" />
      <stop offset="0.5" stop-color="#1b2a45" />
      <stop offset="1" stop-color="#0b1524" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5a86" />
      <stop offset="1" stop-color="#22375a" />
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8506b" />
      <stop offset="1" stop-color="#93243a" />
    </linearGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none" />
      <path d="M0 0H14" stroke="#2c4266" stroke-width="1" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="220" height="308" rx="12" fill="url(#bg)" />
  <rect width="220" height="308" rx="12" fill="url(#grid)" opacity="0.6" />

  <rect x="9" y="9" width="202" height="290" rx="8" fill="none" stroke="url(#frame)"
    stroke-width="2.5" />
  <rect x="15" y="15" width="190" height="278" rx="6" fill="none" stroke="#2c4266" stroke-width="1"
    opacity="0.8" />

  <!-- central emblem: corp diamond over hexagon -->
  <g transform="translate(110,140)">
    <path d="M0 -66 L57 -33 L57 33 L0 66 L-57 33 L-57 -33 Z" fill="none" stroke="#3d5a86"
      stroke-width="3" opacity="0.9" />
    <path d="M0 -66 L57 -33 L57 33 L0 66 L-57 33 L-57 -33 Z" fill="none" stroke="#1a2c48"
      stroke-width="8" opacity="0.5" />
    <path d="M0 -34 L34 0 L0 34 L-34 0 Z" fill="url(#gem)" />
    <path d="M0 -34 L34 0 L0 34 L-34 0 Z" fill="none" stroke="#f2a0b0" stroke-width="1.5"
      opacity="0.7" />
    <path d="M0 -18 L18 0 L0 18 L-18 0 Z" fill="#101c30" opacity="0.55" />
  </g>

  <!-- corner ticks -->
  <g stroke="#3d5a86" stroke-width="2" opacity="0.8">
    <path d="M22 40 V22 H40" />
    <path d="M198 40 V22 H180" />
    <path d="M22 268 V286 H40" />
    <path d="M198 268 V286 H180" />
  </g>

  <text x="110" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
    font-size="13" letter-spacing="6" fill="#7f9cc4" opacity="0.9">CORP</text>
</svg>
