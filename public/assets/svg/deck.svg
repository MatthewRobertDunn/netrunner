<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg fill="#d7dde8" width="100%" height="100%" viewBox="0 0 200 200" version="1.1"
  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve"
  xmlns:serif="http://www.serif.com/"
  style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <!-- A deck: three stacked cards, slightly rotated so the pile reads at
       small sizes (same mono-glyph style as the other status icons). -->
  <g transform="rotate(-14 100 100)">
    <rect x="46" y="26" width="72" height="100" rx="9" />
    <rect x="60" y="46" width="72" height="100" rx="9" />
    <rect x="74" y="66" width="72" height="100" rx="9" />
  </g>
</svg>
